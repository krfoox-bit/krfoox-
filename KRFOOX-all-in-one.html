ackground:#fff;color:var(--ink);border-radius:11px;border:1px solid var(--line)}.slot.selected{background:#f3d39b;color:#171918;border:2px solid #333}.slot:disabled{background:#eee;color:#999}.contacts-large{margin-top:26px}@media(max-width:520px){.steps{gap:4px}.step{font-size:12px}.step-num{width:30px;height:30px}.step-actions button{padding:12px 8px}}\n\u003c/style>\n\u003c/head>\u003cbody>\u003cmain class=\"wrap\">\n\u003cheader>\u003ch1>KRFOOX\u003c/h1>\u003cp>BARBERSHOP · МУЖСКИЕ СТРИЖКИ\u003c/p>\u003cnav>\u003ca href=\"#booking\">Записаться\u003c/a>\u003ca href=\"#photos\">Фотографии\u003c/a>\u003ca href=\"#reviews\">Отзывы\u003c/a>\u003ca href=\"#contacts\">Контакты\u003c/a>\u003c/nav>\u003c/header>\n\u003csection class=\"card booking-card\" id=\"booking\">\u003cdiv id=\"announcementList\">\u003c/div>\n\u003ch2 class=\"booking-title\">Запишитесь на стрижку\u003c/h2>\n\u003cp class=\"booking-subtitle\">Выберите дату и удобное время\u003c/p>\n\u003cdiv class=\"notice\" id=\"shopStatus\" role=\"status\">Проверяем статус салона…\u003c/div>\n\u003cdiv class=\"steps\" aria-label=\"Этапы записи\">\n  \u003cdiv class=\"step active\" data-step-indicator=\"1\">\u003cspan class=\"step-num\">1\u003c/span>\u003cspan>Дата и время\u003c/span>\u003c/div>\n  \u003cdiv class=\"step\" data-step-indicator=\"2\">\u003cspan class=\"step-num\">2\u003c/span>\u003cspan>Контакты\u003c/span>\u003c/div>\n\u003c/div>\n\u003cform id=\"bookingForm\">\n  \u003cdiv class=\"step-panel active\" data-step-panel=\"1\">\n    \u003clabel>ВЫБЕРИТЕ ДАТУ\u003c/label>\n    \u003cdiv class=\"calendar-head\">\u003cbutton type=\"button\" id=\"prevMonth\" aria-label=\"Предыдущий месяц\">‹\u003c/button>\u003cspan class=\"month\" id=\"monthLabel\">\u003c/span>\u003cbutton type=\"button\" id=\"nextMonth\" aria-label=\"Следующий месяц\">›\u003c/button>\u003c/div>\n    \u003cdiv id=\"calendar\" class=\"calendar\">\u003c/div>\u003cinput type=\"hidden\" id=\"bookingDate\" required>\n    \u003clabel class=\"date-time-label\">ВЫБЕРИТЕ ВРЕМЯ\u003c/label>\n    \u003cdiv id=\"slots\" class=\"slots\">\u003cp>Сначала выбери дату.\u003c/p>\u003c/div>\u003cinput id=\"bookingTime\" type=\"hidden\" required>\n    \u003cdiv class=\"step-actions\">\u003cbutton type=\"button\" class=\"btn-dark\" id=\"toContacts\">Далее →\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"step-panel\" data-step-panel=\"2\">\n    \u003ch3 style=\"margin:8px 0\">Контактные данные\u003c/h3>\n    \u003cp id=\"bookingSummary\">Укажите имя и номер телефона.\u003c/p>\n    \u003clabel for=\"clientName\">ИМЯ\u003c/label>\u003cinput id=\"clientName\" required maxlength=\"80\" placeholder=\"Как к тебе обращаться\" autocomplete=\"name\">\n    \u003clabel for=\"clientPhone\">ТЕЛЕФОН\u003c/label>\u003cinput id=\"clientPhone\" required type=\"tel\" maxlength=\"30\" placeholder=\"+996 ...\" autocomplete=\"tel\">\n    \u003cdiv class=\"step-actions\">\u003cbutton type=\"button\" class=\"btn-light\" id=\"backToDate\">← Назад\u003c/button>\u003cbutton type=\"submit\" class=\"btn-dark\" id=\"submitBooking\">Подтвердить запись\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"bookingStatus\" class=\"status\" role=\"status\">\u003c/div>\n\u003c/form>\u003c/section>\n\u003csection class=\"card\" id=\"photos\">\n  \u003cdiv class=\"photo-gallery\" id=\"photoList\" aria-label=\"Фотографии работ KRFOOX\">\u003c/div>\n  \u003cdiv id=\"photoStatus\" class=\"status\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"reviews\">\u003ch2>Отзывы клиентов\u003c/h2>\u003cp>Оставь отзыв о визите. Он появится на сайте после проверки владельцем.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"reviewName\">ИМЯ\u003c/label>\u003cinput id=\"reviewName\" maxlength=\"80\">\u003c/div>\u003cdiv>\u003clabel for=\"reviewRating\">ОЦЕНКА\u003c/label>\u003cselect id=\"reviewRating\">\u003coption value=\"5\">★★★★★ — Отлично\u003c/option>\u003coption value=\"4\">★★★★☆ — Хорошо\u003c/option>\u003coption value=\ u003cspan>Салон открыт для онлайн-записи\u003c/span>\u003c/label>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"openAt\">ВРЕМЯ ОТКРЫТИЯ\u003c/label>\u003cinput id=\"openAt\" type=\"time\" value=\"08:00\">\u003c/div>\u003cdiv>\u003clabel for=\"closeAt\">ВРЕМЯ ЗАКРЫТИЯ\u003c/label>\u003cinput id=\"closeAt\" type=\"time\" value=\"00:00\">\u003c/div>\u003cdiv>\u003clabel for=\"closeDateTime\">ЗАПЛАНИРОВАТЬ ЗАКРЫТИЕ\u003c/label>\u003cinput id=\"closeDateTime\" type=\"datetime-local\">\u003c/div>\u003cdiv>\u003clabel for=\"reopenDateTime\">ЗАПЛАНИРОВАТЬ ОТКРЫТИЕ\u003c/label>\u003cinput id=\"reopenDateTime\" type=\"datetime-local\">\u003c/div>\u003c/div>\u003cdiv style=\"margin-top:16px;display:flex;gap:10px;flex-wrap:wrap\">\u003cbutton onclick=\"saveHoursSettings()\">Сохранить расписание\u003c/button>\u003cbutton class=\"danger\" onclick=\"setSalonStatus(false)\">Закрыть сейчас\u003c/button>\u003cbutton class=\"secondary\" onclick=\"setSalonStatus(true)\">Открыть сейчас\u003c/button>\u003c/div>\u003cdiv id=\"hoursStatus\" class=\"status\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tab\" id=\"tab-bookings\">\u003cdiv class=\"card\">\u003ch2>Записи клиентов\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>КЛИЕНТ\u003c/th>\u003cth>ТЕЛЕФОН\u003c/th>\u003cth>ДАТА\u003c/th>\u003cth>ВРЕМЯ\u003c/th>\u003cth>УСЛУГА\u003c/th>\u003cth>СТАТУС\u003c/th>\u003cth>ДЕЙСТВИЯ\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rows\">\u003ctr>\u003ctd colspan=\"7\">Загрузка...\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tab\" id=\"tab-settings\">\u003cdiv class=\"card\">\u003ch2>Подключение Supabase\u003c/h2>\u003clabel>SUPABASE URL\u003c/label>\u003cinput value=\"https://vzaqywzyilsmcddjvfqk.supabase.co\" readonly>\u003clabel>ПУБЛИЧНЫЙ КЛЮЧ\u003c/label>\u003cinput value=\"sb_publishable_IwQXoyWwztmg3yUAVvWoAA_ZAQoL7MQ\" readonly>\u003cp>Это публичный ключ для браузера. Никогда не добавляйте ('loginStatus','Проверяем подключение...',false);try{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw Error('Сессия не создана.');await checkAuth();}catch(e){msg('loginStatus','Ошибка входа: '+explain(e));}finally{button.disabled=false;button.textContent='Войти в систему';}}\nasync function logout(){if(!db)return;const{error}=await db.auth.signOut();if(error)msg('dataStatus','Ошибка выхода: '+explain(error));await checkAuth();}\nasync function checkAuth(){if(!db){msg('loginStatus','Библиотека Supabase не загрузилась. Проверьте интернет и обновите страницу.');return;}try{const{data,error}=await db.auth.getSession();if(error)throw error;const yes=!!data.session;document.getElementById('loginCard').style.display=yes?'none':'block';document.getElementById('app').style.display=yes?'block':'none';if(yes)await Promise.allSettled([loadAllData(),loadSitesFromDB(),loadHoursSettingsToUI()]);}catch(e){msg('loginStatus','Ошибка проверки входа: '+explain(e));}}\nfunction switchTab(id,button){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');button.classList.add('active');}\nasync function loadAllData(){if(!db||busy)return;busy=true;msg('dataStatus','Загружаем записи...',false);try{const{data,error}=await db.from('bookings').select('*').order('booking_date',{ascending:true});if(error)throw error;bookings=data||[];document.getElementById('totalBookings').textContent=bookings.length;const n=new Date(),today=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;document.getElementById('todayBookings').textContent=bookings.filter(x=>String(x.booking_date||'').slice(0,10)===today).length;document.getElementById('totalSites').textContent=sites.length;renderBookings();msg('dataStatus','Данные успешно обновлены.',false);}catch(e){msg('dataStatus','Ошибка загрузки записей: '+explain(e));}finally{busy=false;}}\nfunction renderBookings(){const body=document.getElementById('rows');body.replaceChildren();if(!bookings.length){body.innerHTML='\u003ctr>\u003ctd colspan=\"7\">Записей пока нет.\u003c/td>\u003c/tr>';return;}for(const r of bookings){const tr=document.createElement('tr');const add=v=>{const td=document.createElement('td');td.textContent=v??'—';tr.appendChild(td);};add(r.client_name||'—');add(r.phone||'—');add(r.booking_date||'—');add(String(r.booking_time||'').slice(0,5));add(r.service||'—');add(r.status||'confirmed');const td=document.createElement('td'),b=document.createElement('button');b.className='danger';b.textContent='Отменить';b.style.padding='6px 10px';b.onclick=()=>cancelBooking(r.id);td.appendChild(b);tr.appendChild(td);body.appendChild(tr);}}\nasync function cancelBooking(id){if(!confirm('Отменить эту запись?'))return;try{const{error}=await db.from('bookings').update({status:'cancelled'}).eq('id',id);if(error)throw error;await loadAllData();}catch(e){alert('Не удалось отменить: '+explain(e));}}\nfunction localValue(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?String(v).slice(0,16):new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}\nfunction isoValue(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d.toISOString();}\nasync function loadHoursSettingsToUI(){try{const{data,error}=await db.from('salon_settings').select('*').eq('id',1).maybeSingle();if(error)throw error;if(data)settings={...settings,...data};document.getElementById('salonOpen').checked=!!settings.open;document.getElementById('openAt').value=settings.open_at||'08:00';document.getElementById('closeAt').value=settings.close_at||'00:00';document.getElementById('closeDateTime').value=localValue(settings.close_datetime);document.getElementById('reopenDateTime').value=localValue(settings.reopen_datetime);msg('hoursStatus','Настройки загружены.',false);}catch(e){msg('hoursStatus','Не удалось загрузить настройки: '+explain(e));}}\nasync function saveHoursSettings(){const s={id:1,open:document.getElementById('salonOpen').checked,open_at:document.getElementById('openAt').value||'08:00',close_at:document.getElementById('closeAt').value||'00:00',close_datetime:isoValue(document.getElementById('closeDateTime').value),reopen_datetime:isoValue(document.getElementById('reopenDateTime').value),updated_at:new Date().toISOString()};try{const{error}=await db.from('salon_settings').upsert(s,{onConflict:'id'});if(error)throw error;settings={...settings,...s};msg('hoursStatus','Расписание и статус сохранены в общей базе.',false);}catch(e){msg('hoursStatus','Не удалось сохранить: '+explain(e));}}\nasync function setSalonStatus(open){document.getElementById('salonOpen').checked=open;await saveHoursSettings();const e=document.getElementById('hoursStatus');if(e.textContent.startsWith('Расписание'))msg('hoursStatus',open?'Салон открыт для онлайн-записи.':'Салон закрыт для онлайн-записи.',false);}\nasync function loadSitesFromDB(){try{const{data,error}=await db.from('sites').select('*').order('id',{ascending:true});if(error)throw error;sites=data||[];if(!sites.length){const{data:created,error:ie}=await db.from('sites').insert({name:'KRFOOX Barbershop (Главный)',phone:'+996 556 685 003'}).select();if(ie)throw ie;sites=created||[];}renderSites();}catch(e){msg('dataStatus','Ошибка загрузки филиалов: '+explain(e));}}\nfunction renderSites(){const box=document.getElementById('sitesList');box.replaceChildren();for(const s of sites){const d=document.createElement('div');d.className='site-card-item';const info=document.createElement('div'),name=document.createElement('strong'),phone=document.createElement('p');name.textContent=s.name||'Без названия';phone.textContent='Телефон: '+(s.phone||'—');phone.style.margin='4px 0';info.append(name,phone);const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;flex-wrap:wrap';const edit=document.createElement('button'),del=document.createElement('button');edit.className='secondary';edit.textContent='Изменить';edit.onclick=()=>editSite(s);del.className='danger';del.textContent='Удалить';del.onclick=()=>deleteSite(s);actions.append(edit,del);d.append(info,actions);box.appendChild(d);}document.getElementById('totalSites').textContent=sites.length;}\nasync function addNewSite(){const name=document.getElementById('newSiteName').value.trim(),phone=document.getElementById('newSitePhone').value.trim();if(!name||!phone){alert('Заполните название и телефон филиала.');return;}try{const{error}=await db.from('sites').insert({name,phone});if(error)throw error;document.getElementById('newSiteName').value='';document.getElementById('newSitePhone').value='';await loadSitesFromDB();alert('Филиал добавлен.');}catch(e){alert('Не удалось добавить филиал: '+explain(e));}}\nasync function deleteSite(s){if(!confirm('Удалить филиал?'))return;try{const{error}=await db.from('sites').delete().eq('id',s.id);if(error)throw error;await loadSitesFromDB();}catch(e){alert('Не удалось удалить: '+explain(e));}}\nasync function editSite(s){const name=prompt('Новое название филиала:',s.name||'');if(name===null)return;const phone=prompt('Новый телефон филиала:',s.phone||'');if(phone===null)return;try{const{error}=await db.from('sites').update({name:name.trim(),phone:phone.trim()}).eq('id',s.id);if(error)throw error;await loadSitesFromDB();}catch(e){alert('Не удалось изменить: '+explain(e));}}\ncheckAuth();\n\u003c/script>\u003c/body>\u003c/html>";
const DATABASE_SQL = "-- KRFOOX Barbershop: shared Supabase schema for client website + admin panel\n-- Run once in Supabase -> SQL Editor. Uses the existing Supabase project.\n-- This script uses CREATE TABLE IF NOT EXISTS and does not delete existing data.\n\ncreate extension if not exists pgcrypto;\n\ncreate table if not exists public.bookings (\n  id bigint generated by default as identity primary key,\n  client_name text not null,\n  phone text not null,\n  booking_date date not null,\n  booking_time time not null,\n  service text not null default 'Запись',\n  status text not null default 'confirmed',\n  created_at timestamptz not null default now()\n);\ncreate index if not exists bookings_date_time_idx on public.bookings (booking_date, booking_time);\n\ncreate table if not exists public.salon_settings (\n  id integer primary key default 1 check (id = 1),\n  open boolean not null default true,\n  open_at time not null default '08:00',\n  close_at time not null default '00:00',\n  close_datetime timestamptz,\n  reopen_datetime timestamptz,\n  updated_at timestamptz not null default now()\n);\ninsert into public.salon_settings (id, open, open_at, close_at)\nvalues (1, true, '08:00', '00:00') on conflict (id) do nothing;\n\ncreate table if not exists public.reviews (\n  id bigint generated by default as identity primary key,\n  client_name text not null,\n  comment text not null,\n  rating integer not null default 5 check (rating between 1 and 5),\n  published boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.site_photos (\n  id bigint generated by default as identity primary key,\n  url text not null,\n  caption text,\n  published boolean not null default true,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.announcements (\n  id bigint generated by default as identity primary key,\n  title text not null,\n  body text,\n  published boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.sites (\n  id bigint generated by default as identity primary key,\n  name text not null,\n  phone text not null,\n  created_at timestamptz not null default now()\n);\ninsert into public.sites (name, phone)\nselect 'KRFOOX Barbershop (Главный)', '+996 556 685 003'\nwhere not exists (select 1 from public.sites);\n\n-- Turn on RLS for all tables.\nalter table public.bookings enable row level security;\nalter table public.salon_settings enable row level security;\nalter table public.reviews enable row level security;\nalter table public.site_photos enable row level security;\nalter table public.announcements enable row level security;\nalter table public.sites enable row level security;\n\n-- Remove only policies with these names so this script can be re-run safely.\ndrop policy if exists \"Public can read salon settings\" on public.salon_settings;\ndrop policy if exists \"Authenticated users manage salon settings\" on public.salon_settings;\ndrop policy if exists \"Public can read published photos\" on public.site_photos;\ndrop policy if exists \"Authenticated users manage photos\" on public.site_photos;\ndrop policy if exists \"Public can read published announcements\" on public.announcements;\ndrop policy if exists \"Authenticated users manage announcements\" on public.announcements;\ndrop policy if exists \"Public can read published reviews\" on public.reviews;\ndrop policy if exists \"Public can submit reviews for moderation\" on public.reviews;\ndrop policy if exists \"Authenticated users manage reviews\" on public.reviews;\ndrop policy if exists \"Authenticated users manage bookings\" on public.bookings;\ndrop policy if exists \"Authenticated users manage sites\" on public.sites;\n\ncreate policy \"Public can read salon settings\" on public.salon_settings\n  for select to anon, authenticated using (true);\ncreate policy \"Authenticated users manage salon settings\" on public.salon_settings\n  for all to authenticated using (auth.uid() is not null) with check (auth.uid() is not null);\n\ncreate policy \"Public can read published photos\" on public.site_photos\n  for select to anon, authenticated using (published = true or auth.uid() is not null);\ncreate policy \"Authenticated users manage photos\" on public.site_photos\n  for all to authenticated using (auth.uid() is not null) with check (auth.uid() is not null);\n\ncreate policy \"Public can read published announcements\" on public.announcements\n  for select to anon, authenticated using (published = true or auth.uid() is not null);\ncreate policy \"Authenticated users manage announcements\" on public.announcements\n  for all to authenticated using (auth.uid() is not null) with check (auth.uid() is not null);\n\ncreate policy \"Public can read published reviews\" on public.reviews\n  for select to anon, authenticated using (published = true or auth.uid() is not null);\ncreate policy \"Public can submit reviews for moderation\" on public.reviews\n  for insert to anon, authenticated with check (published = false and length(trim(client_name)) between 1 and 80 and length(trim(comment)) between 1 and 1000 and rating between 1 and 5);\ncreate policy \"Authenticated users manage reviews\" on public.reviews\n  for all to authenticated using (auth.uid() is not null) with check (auth.uid() is not null);\n\ncreate policy \"Authenticated users manage bookings\" on public.bookings\n  for all to authenticated using (auth.uid() is not null) with check (auth.uid() is not null);\ncreate policy \"Authenticated users manage sites\" on public.sites\n  for all to authenticated using (auth.uid() is not null) with check (auth.uid() is not null);\n\n-- Return only booked date/time/status values needed by the public booking calendar.\ncreate or replace function public.krfoox_booked_times(p_date_from date default current_date)\nreturns table (booking_date date, booking_time time, status text)\nlanguage sql stable security definer set search_path = public\nas $$\n  select b.booking_date, b.booking_time, b.status\n  from public.bookings b\n  where b.booking_date >= coalesce(p_date_from, current_date)\n    and lower(coalesce(b.status, 'confirmed')) not in ('cancelled', 'canceled')\n  order by b.booking_date, b.booking_time;\n$$;\nrevoke all on function public.krfoox_booked_times(date) from public;\ngrant execute on function public.krfoox_booked_times(date) to anon, authenticated;\n\n-- Atomically check availability and create a booking. The client never needs direct public SELECT on bookings.\ncreate or replace function public.krfoox_create_booking(\n  p_client_name text,\n  p_phone text,\n  p_booking_date date,\n  p_booking_time time,\n  p_service text default 'Запись'\n) returns jsonb\nlanguage plpgsql security definer set search_path = public\nas $$\ndeclare\n  v_settings public.salon_settings%rowtype;\n  v_id text;\n  v_end integer;\n  v_start integer;\n  v_requested integer;\nbegin\n  if coalesce(length(trim(p_client_name)), 0) not between 1 and 80 then\n    return jsonb_build_object('ok', false, 'message', 'Укажите имя длиной до 80 символов.');\n  end if;\n  if coalesce(length(trim(p_phone)), 0) not between 5 and 30 then\n    return jsonb_build_object('ok', false, 'message', 'Проверьте номер телефона.');\n  end if;\n  if p_booking_date \u003c current_date then\n    return jsonb_build_object('ok', false, 'message', 'Нельзя записаться на прошедшую дату.');\n  end if;\n\n  select * into v_settings from public.salon_settings where id = 1;\n  if not found then\n    v_settings.open := true; v_settings.open_at := '08:00'; v_settings.close_at := '00:00';\n  end if;\n  if not coalesce(v_settings.open, true) then\n    return jsonb_build_object('ok', false, 'message', 'Онлайн-запись временно закрыта.');\n  end if;\n\n  v_start := extract(hour from coalesce(v_settings.open_at, time '08:00'))::integer * 60\n             + extract(minute from coalesce(v_settings.open_at, time '08:00'))::integer;\n  v_end := extract(hour from coalesce(v_settings.close_at, time '00:00'))::integer * 60\n           + extract(minute from coalesce(v_settings.close_at, time '00:00'))::integer;\n  if v_end = 0 then v_end := 1440; end if;\n  v_requested := extract(hour from p_booking_time)::integer * 60 + extract(minute from p_booking_time)::integer;\n  if v_requested \u003c v_start or v_requested >= v_end or mod(v_requested - v_start, 20) \u003c> 0 then\n    return jsonb_build_object('ok', false, 'message', 'Это время не входит в расписание салона.');\n  end if;\n\n  -- Serialize competing requests for the same date/time to prevent double bookings.\n  perform pg_advisory_xact_lock(hashtext(p_booking_date::text), hashtext(p_booking_time::text));\n  if exists (\n    select 1 from public.bookings b\n    where b.booking_date = p_booking_date and b.booking_time = p_booking_time\n      and lower(coalesce(b.status, 'confirmed')) not in ('cancelled', 'canceled')\n  ) then\n    return jsonb_build_object('ok', false, 'message', 'Это время уже занято. Выбери другое.');\n  end if;\n\n  insert into public.bookings (client_name, phone, booking_date, booking_time, service, status)\n  values (trim(p_client_name), trim(p_phone), p_booking_date, p_booking_time, coalesce(nullif(trim(p_service), ''), 'Запись'), 'confirmed')\n  returning id::text into v_id;\n  return jsonb_build_object('ok', true, 'id', v_id);\nend;\n$$;\nrevoke all on function public.krfoox_create_booking(text, text, date, time, text) from public;\ngrant execute on function public.krfoox_create_booking(text, text, date, time, text) to anon, authenticated;\n\n-- Public website can submit reviews and read published content; only signed-in users can manage admin data.\n-- IMPORTANT: create only the owner's account in Supabase Authentication -> Users. These policies treat any authenticated account as an admin.\n";
const frame = document.getElementById('appFrame');
function showView(view){
  document.getElementById('database').style.display = view === 'database' ? 'block' : 'none';
  frame.style.display = view === 'database' ? 'none' : 'block';
  for (const [id,name] of [['clientTab','client'],['adminTab','admin'],['dbTab','database']]) {
    document.getElementById(id).classList.toggle('active', view === name);
  }
  if(view === 'client') frame.srcdoc = CLIENT_HTML;
  if(view === 'admin') frame.srcdoc = ADMIN_HTML;
  if(view === 'database') document.getElementById('sqlText').value = DATABASE_SQL;
}
async function copySQL(){
  const box = document.getElementById('sqlText');
  try {
    await navigator.clipboard.writeText(box.value);
    document.getElementById('copyStatus').textContent = 'SQL скопирован. Теперь вставь его в Supabase SQL Editor.';
  } catch(e) {
    box.focus(); box.select();
    document.getElementById('copyStatus').textContent = 'Выделил SQL. Нажми «Копировать» в меню браузера.';
  }
}
showView('client');
